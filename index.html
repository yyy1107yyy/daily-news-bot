<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持仓解套与防T飞量化驾驶舱</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --up: #ef4444;
      --down: #10b981;
      --accent: #3b82f6;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      max-width: 1360px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .sub-tip { font-size: 0.8rem; color: #38bdf8; margin-top: 2px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.84rem;
      transition: all 0.15s;
    }
    button:hover { opacity: 0.9; }
    button.mode-btn {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .grid {
      max-width: 1360px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(410px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .card.trapped { border-top: 3px solid var(--warn); }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .title-group h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
    .tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.18);
      color: var(--warn);
      font-weight: 600;
    }
    .code { color: var(--muted); font-size: 0.78rem; font-family: monospace; margin-top: 3px; }
    .price-box { text-align: right; }
    .price { font-size: 1.55rem; font-weight: 700; font-family: monospace; }
    .pct { font-size: 0.9rem; font-weight: 600; font-family: monospace; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .signal-bar {
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.81rem;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .signal-bar.warn-fly {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .tier-section-title {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: -4px;
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }
    .lvl-item {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid transparent;
      padding: 7px 5px;
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lvl-item:hover { border-color: #64748b; }
    .lvl-item.active-buy {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }
    .lvl-item.active-sell {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }
    .lvl-label { font-size: 0.72rem; color: #cbd5e1; font-weight: 600; }
    .lvl-sub { font-size: 0.65rem; color: var(--muted); }
    .lvl-val { font-size: 0.94rem; font-weight: 700; font-family: monospace; margin-top: 2px; }
    .lvl-pct { font-size: 0.74rem; font-weight: 600; font-family: monospace; }
    .lvl-diff {
      font-size: 0.66rem;
      color: #94a3b8;
      font-family: monospace;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
      padding: 1px 4px;
      margin-top: 1px;
    }
    .c-buy { color: #34d399; }
    .c-sell { color: #f87171; }
    .c-vwap { color: #fbbf24; }

    .ma-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 0.74rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.35);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
    }

    .calc-box {
      border-top: 1px dashed var(--border);
      padding-top: 9px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .calc-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .input-grp { display: flex; flex-direction: column; gap: 3px; }
    .input-grp label { font-size: 0.72rem; color: var(--muted); }
    .input-grp input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.84rem;
      font-family: monospace;
      width: 100%;
    }
    .calc-result {
      font-size: 0.79rem;
      color: #e2e8f0;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>🎯 持仓解套与防T飞量化驾驶舱</h1>
      <div class="sub-tip" id="mode-desc">🛡️ 当前模式：【防T飞棘轮模式】下跌时买点绝不后退（安心挂单），拉升时高抛点随均价自动上移（防早盘卖飞）！</div>
    </div>
    <div class="controls">
      <button class="mode-btn" id="toggle-mode-btn" onclick="toggleCalcMode()">切换为：实时浮动模式</button>
      <span id="update-time">正在同步数据...</span>
      <button onclick="refreshAll()">立即刷新</button>
    </div>
  </div>

  <div class="grid" id="cards-container"></div>

<script>
const TARGETS = [
  { symbol: "sh515880", code: "515880", name: "通信ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "0.583", defaultShares: 1700 },
  { symbol: "sz159327", code: "159327", name: "半导材料ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "0.978", defaultShares: 6300 },
  { symbol: "sh517520", code: "517520", name: "永赢黄金股ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "1.678", defaultShares: 500 },
  { symbol: "sz002716", code: "002716", name: "湖南白银", isETF: false, trapped: true, decimals: 2, defaultCost: "9.130", defaultShares: 100 },
  { symbol: "sh518880", code: "518880", name: "华安黄金ETF", isETF: true, trapped: false, decimals: 3, defaultCost: "", defaultShares: 1000 },
  { symbol: "sh513050", code: "513050", name: "中概互联网ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "1.144", defaultShares: 10000 },
  { symbol: "sh512400", code: "512400", name: "有色金属ETF", isETF: true, trapped: false, decimals: 3, defaultCost: "", defaultShares: 1000 },
  { symbol: "sz159930", code: "159930", name: "汇添富能源ETF", isETF: true, trapped: false, decimals: 3, defaultCost: "", defaultShares: 1000 }
];

const marketData = {};
// 默认开启 "ratchet" (防T飞棘轮模式)，可选 "dynamic" (实时跟随)
let calcMode = localStorage.getItem("t_calc_mode") || "ratchet";

function updateModeUI() {
  const desc = document.getElementById("mode-desc");
  const btn = document.getElementById("toggle-mode-btn");
  if (calcMode === "ratchet") {
    desc.innerText = "🛡️ 当前：【防T飞棘轮模式】股价下跌时买点绝不后退（挂单省心），强势拉升或放量时高抛点自动上移拓宽（严防T飞）！";
    btn.innerText = "🔄 切换为：实时跟随模式";
  } else {
    desc.innerText = "🌊 当前：【实时跟随模式】三档买点与卖点每15秒完全跟随当前最新价动态浮动。";
    btn.innerText = "🛡️ 切换为：防T飞棘轮模式";
  }
}

function toggleCalcMode() {
  calcMode = calcMode === "ratchet" ? "dynamic" : "ratchet";
  localStorage.setItem("t_calc_mode", calcMode);
  updateModeUI();
  renderCards();
}

function loadScript(url) {
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = url;
    s.charset = "gbk";
    s.onload = () => { s.remove(); resolve(true); };
    s.onerror = () => { s.remove(); resolve(false); };
    document.body.appendChild(s);
  });
}

function getSavedConfig(t) {
  const def = {
    cost: t.defaultCost || "",
    shares: t.defaultShares || 1000,
    tShares: t.defaultShares || 1000,
    buyTier: 1,
    sellTier: 1
  };
  try {
    const raw = localStorage.getItem("t_cfg_v2_" + t.code);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { ...def, ...parsed };
    }
  } catch (e) {}
  return def;
}

function saveConfig(code, field, val) {
  const t = TARGETS.find(x => x.code === code);
  const cfg = getSavedConfig(t);
  cfg[field] = val;
  if (field === "shares") {
    cfg.tShares = val;
  }
  if (field === "tShares" && parseFloat(val) > parseFloat(cfg.shares) && parseFloat(cfg.shares) > 0) {
    cfg.tShares = cfg.shares;
  }
  localStorage.setItem("t_cfg_v2_" + code, JSON.stringify(cfg));
  renderCards();
}

function selectTier(code, type, tierNum) {
  saveConfig(code, type === "buy" ? "buyTier" : "sellTier", tierNum);
}

function fmtDayPct(targetPrice, prevClose) {
  if (!targetPrice || !prevClose || isNaN(targetPrice) || isNaN(prevClose)) return "";
  const pct = ((targetPrice - prevClose) / prevClose) * 100;
  const sign = pct >= 0 ? "+" : "";
  return `(${sign}${pct.toFixed(2)}%)`;
}

function fmtDiffNow(targetPrice, curPrice) {
  if (!targetPrice || !curPrice || isNaN(targetPrice) || isNaN(curPrice)) return "--";
  const diff = ((targetPrice - curPrice) / curPrice) * 100;
  const sign = diff >= 0 ? "+" : "";
  return `距现价 ${sign}${diff.toFixed(2)}%`;
}

async function fetchRealtimeQuotes() {
  const qStr = TARGETS.map(t => t.symbol).join(",");
  await loadScript(`https://qt.gtimg.cn/q=${qStr}&_t=${Date.now()}`);
  TARGETS.forEach(t => {
    const raw = window["v_" + t.symbol];
    if (!raw) return;
    const p = raw.split("~");
    if (p.length > 40) {
      const price = parseFloat(p[3]) || 0;
      const prevClose = parseFloat(p[4]) || 0;
      const open = parseFloat(p[5]) || 0;
      const high = parseFloat(p[33]) || price;
      const low = parseFloat(p[34]) || price;
      const pct = parseFloat(p[32]) || 0;
      const volRatio = parseFloat(p[49]) || 1.0;

      let vwap = (high + low + price) / 3;
      if (p[35] && p[35].includes("/")) {
        const sub = p[35].split("/");
        const volHands = parseFloat(sub[1]);
        const amtYuan = parseFloat(sub[2]);
        if (volHands > 0 && amtYuan > 0) {
          const calcVwap = amtYuan / (volHands * 100);
          if (calcVwap >= low * 0.98 && calcVwap <= high * 1.02) {
            vwap = calcVwap;
          }
        }
      }
      marketData[t.code] = {
        ...(marketData[t.code] || {}),
        price, prevClose, open, high, low, pct, vwap, volRatio
      };
    }
  });
}

async function fetchKLines() {
  const promises = TARGETS.map(async (t) => {
    const varName = "kline_" + t.symbol;
    const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var=${varName}&param=${t.symbol},day,,,30,qfq&_t=${Date.now()}`;
    await loadScript(url);
    const res = window[varName];
    if (res && res.data && res.data[t.symbol]) {
      const dObj = res.data[t.symbol];
      const klist = dObj.qfqday || dObj.day || [];
      if (klist.length >= 2) {
        const todayStr = new Date().toISOString().slice(0, 10);
        const lastBar = klist[klist.length - 1];
        const prevBar = (lastBar[0] === todayStr && klist.length >= 2)
          ? klist[klist.length - 2]
          : lastBar;

        const yHigh = parseFloat(prevBar[3]);
        const yLow = parseFloat(prevBar[4]);
        const yClose = parseFloat(prevBar[2]);

        const closes = klist.map(k => parseFloat(k[2]));
        const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
        const ma5 = closes.length >= 5 ? avg(closes.slice(-5)) : yClose;
        const ma10 = closes.length >= 10 ? avg(closes.slice(-10)) : yClose;
        const ma20 = closes.length >= 20 ? avg(closes.slice(-20)) : yClose;

        let trSum = 0, trCount = 0;
        for (let i = Math.max(1, klist.length - 14); i < klist.length; i++) {
          const curH = parseFloat(klist[i][3]);
          const curL = parseFloat(klist[i][4]);
          const preC = parseFloat(klist[i - 1][2]);
          const tr = Math.max(curH - curL, Math.abs(curH - preC), Math.abs(curL - preC));
          trSum += tr;
          trCount++;
        }
        const atr = trCount > 0 ? trSum / trCount : (yHigh - yLow);

        marketData[t.code] = {
          ...(marketData[t.code] || {}),
          yHigh, yLow, yClose, ma5, ma10, ma20, atr
        };
      }
    }
  });
  await Promise.all(promises);
}

// 核心升级：支持【防T飞棘轮模式】与【实时跟随模式】
function calcDynamicTiers(d) {
  if (!d || !d.price || !d.atr) return null;
  const vwap = d.vwap || d.price;
  const atr = d.atr;
  const prevClose = d.prevClose || d.price;
  const open = d.open || prevClose;

  if (calcMode === "ratchet") {
    // 1. 买点定靶不后退：以【昨收/今开均值】与【今日分时均价】的较高者作为强势支撑锚点
    // 股价下跌时，它锚定在均价/昨收，绝不随现价下跌而往后缩！
    const baseAnchor = (prevClose + open) / 2;
    const buyAnchor = Math.max(baseAnchor, vwap);

    const buy1 = buyAnchor - 0.25 * atr;
    const buy2 = buyAnchor - 0.52 * atr;
    const buy3 = buyAnchor - 0.85 * atr;

    // 2. 卖点防T飞自动上移：当盘中放量（量比>1.3）或大涨（涨幅>2.5%）时，自动放宽卖点系数，防止早盘冲高把筹码卖丢！
    const isStrong = (d.pct >= 2.5) || (d.volRatio >= 1.35 && d.price > vwap);
    const sellBoost = isStrong ? 1.28 : 1.0;

    // 卖点基准取【昨收、分时均价、今日最高价回落锚点】的最大值，水涨船高
    const sellAnchor = Math.max(prevClose, vwap, d.high - 0.15 * atr);
    const sell1 = sellAnchor + (0.38 * atr * sellBoost);
    const sell2 = sellAnchor + (0.75 * atr * sellBoost);

    return { buy1, buy2, buy3, sell1, sell2, isStrong };
  } else {
    // 实时跟随模式
    const center = vwap * 0.65 + d.price * 0.35;
    const buy1 = Math.min(vwap - 0.22 * atr, d.price - 0.20 * atr);
    const buy2 = center - 0.50 * atr;
    const buy3 = center - 0.85 * atr;
    const sell1 = Math.max(vwap + 0.32 * atr, d.price + 0.22 * atr);
    const sell2 = center + 0.70 * atr;
    return { buy1, buy2, buy3, sell1, sell2, isStrong: false };
  }
}

function getActionSignal(d, tiers, dec) {
  if (!d || !d.price || !tiers) return { text: "⏳ 正在同步数据...", warnFly: false };
  const p = d.price;
  const vwapDiff = ((p - d.vwap) / d.vwap * 100).toFixed(2);

  // 防T飞核心预警：当放量突破或大涨且站稳分时均线之上时，严禁盲目全仓先卖后买（反T）
  if (tiers.isStrong && p > d.vwap) {
    if (p >= tiers.sell2 * 0.998) {
      return { text: `🔥 放量主升触及【二档强抛 ${tiers.sell2.toFixed(dec)}】· 最多卖 1/3 底仓，严防T飞！`, warnFly: true };
    }
    return { text: `🔥 盘面强势防T飞保护中（高抛位已自动上移）· 切忌过早反T卖空底仓，等回踩均线做正T！`, warnFly: true };
  }

  if (p <= tiers.buy2) return { text: `🟢 已跌入【二档中吸 ${tiers.buy2.toFixed(dec)} ${fmtDayPct(tiers.buy2, d.prevClose)}】· 极佳正T接货区`, warnFly: false };
  if (p <= tiers.buy1 * 1.002) return { text: `🟢 触及【一档浅吸 ${tiers.buy1.toFixed(dec)} ${fmtDayPct(tiers.buy1, d.prevClose)}】· 可先买后卖做正T`, warnFly: false };
  if (p >= tiers.sell2 * 0.998) return { text: `🔴 冲高触及【二档强抛 ${tiers.sell2.toFixed(dec)} ${fmtDayPct(tiers.sell2, d.prevClose)}】· 分批高抛锁利`, warnFly: false };
  if (p >= tiers.sell1 * 0.998) return { text: `🔴 触及【一档高抛 ${tiers.sell1.toFixed(dec)} ${fmtDayPct(tiers.sell1, d.prevClose)}】· 可卖 30% 底仓做小反T`, warnFly: false };
  return { text: `⚪ 围绕均价线震荡（偏离 ${vwapDiff > 0 ? "+" : ""}${vwapDiff}%）· 买点已锚定不后退，挂【一档 ${tiers.buy1.toFixed(dec)}】守株待兔`, warnFly: false };
}

function renderTierBox(code, type, tierNum, label, sub, priceVal, d, dec, isActive) {
  const fmt = v => (v !== undefined && !isNaN(v)) ? v.toFixed(dec) : "--";
  const activeCls = isActive ? (type === "buy" ? "active-buy" : "active-sell") : "";
  const colorCls = type === "buy" ? "c-buy" : (type === "sell" ? "c-sell" : "c-vwap");
  const dayPctStr = priceVal ? fmtDayPct(priceVal, d.prevClose) : "";
  const dayPctColor = (priceVal && d.prevClose && priceVal >= d.prevClose) ? "up" : "down";
  const diffNowStr = priceVal ? fmtDiffNow(priceVal, d.price) : "--";
  const clickAttr = type === "vwap" ? "" : `onclick="selectTier('${code}', '${type}', ${tierNum})"`;

  return `
    <div class="lvl-item ${activeCls}" ${clickAttr} style="${type === 'vwap' ? 'cursor:default' : ''}">
      <span class="lvl-label">${label}</span>
      <span class="lvl-sub">${sub}</span>
      <span class="lvl-val ${colorCls}">${fmt(priceVal)}</span>
      <span class="lvl-pct ${dayPctColor}">盘面 ${dayPctStr || '--'}</span>
      <span class="lvl-diff">${diffNowStr}</span>
    </div>
  `;
}

function renderCards() {
  const container = document.getElementById("cards-container");
  container.innerHTML = TARGETS.map(t => {
    const d = marketData[t.code] || {};
    const dec = t.decimals;
    const fmt = v => (v !== undefined && !isNaN(v)) ? v.toFixed(dec) : "--";
    const priceStr = d.price ? d.price.toFixed(dec) : "--";
    const pct = d.pct || 0;
    const pctStr = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
    const colorCls = pct >= 0 ? "up" : "down";
    const atrPct = (d.atr && d.price) ? ((d.atr / d.price) * 100).toFixed(2) + "%" : "--";

    const tiers = calcDynamicTiers(d);
    const sig = getActionSignal(d, tiers, dec);
    const cfg = getSavedConfig(t);
    const costNum = parseFloat(cfg.cost);
    const sharesNum = parseFloat(cfg.shares) || 0;
    const tSharesNum = Math.min(parseFloat(cfg.tShares) || 0, sharesNum);

    // 防T飞分批挂单股数建议（按100股整数倍拆单）
    const lot1 = Math.max(100, Math.round((tSharesNum * 0.4) / 100) * 100);
    const lot2 = Math.max(0, tSharesNum - lot1);

    const buyTierNames = { 1: "一档浅吸", 2: "二档中吸", 3: "三档深吸" };
    const sellTierNames = { 1: "一档高抛", 2: "二档强抛" };

    let calcHtml = `<span style="color:var(--muted)">💡 填入成本价与底仓股数，自动测算做T降本金额</span>`;
    if (d.price && tiers && sharesNum > 0) {
      const selBuyPrice = tiers["buy" + (cfg.buyTier || 1)];
      const selSellPrice = tiers["sell" + (cfg.sellTier || 1)];
      const spread = Math.max(0, selSellPrice - selBuyPrice);
      const spreadPct = ((spread / selBuyPrice) * 100).toFixed(2);
      const feeRate = t.isETF ? 0.0001 : 0.0007;
      const grossProfit = spread * tSharesNum;
      const fee = (selBuyPrice + selSellPrice) * tSharesNum * feeRate;
      const netProfit = Math.max(0, grossProfit - fee);
      const costDropPerShare = netProfit / sharesNum;

      const splitTip = tSharesNum >= 400
        ? `🛡️ <b>防T飞拆单法</b>：建议在【一档高抛 ${fmt(tiers.sell1)}】只挂卖 <b>${lot1}股</b>，留 <b>${lot2}股</b> 挂【二档强抛 ${fmt(tiers.sell2)}】博大肉！`
        : `🛡️ <b>防T飞法则</b>：股数较少建议优先做<b>正T（跌到绿字先买，涨到红字再卖）</b>，永远不丢底仓！`;

      if (costNum > 0) {
        const pnlPct = ((d.price - costNum) / costNum * 100).toFixed(2);
        const needUpPct = costNum > d.price ? (((costNum - d.price) / d.price) * 100).toFixed(2) : "0.00";
        const newCost = (costNum - costDropPerShare).toFixed(dec);
        const newPnlPct = ((d.price - newCost) / newCost * 100).toFixed(2);
        calcHtml = `
          <div>📌 当前浮亏：<b class="${d.price >= costNum ? 'up' : 'down'}">${pnlPct}%</b>（距回本还需涨 <b>+${needUpPct}%</b>）</div>
          <div>⚡ 选中【<b>${buyTierNames[cfg.buyTier]} ${fmt(selBuyPrice)}</b> 买 → <b>${sellTierNames[cfg.sellTier]} ${fmt(selSellPrice)}</b> 卖】做T <b>${tSharesNum}</b> 股：净赚 <b>¥${netProfit.toFixed(1)}</b>，成本降至 <b style="color:#34d399">${newCost}</b>（浮亏缩至 <b>${newPnlPct}%</b>）</div>
          <div style="color:#fcd34d;margin-top:2px;">${splitTip}</div>
        `;
      } else {
        calcHtml = `
          <div>⚡ 选中档位【${buyTierNames[cfg.buyTier]} ${fmt(selBuyPrice)} → ${sellTierNames[cfg.sellTier]} ${fmt(selSellPrice)}】差价：<b>${fmt(spread)}元 (+${spreadPct}%)</b>，净赚约 <b>¥${netProfit.toFixed(1)}</b></div>
          <div style="color:#fcd34d;margin-top:2px;">${splitTip}</div>
        `;
      }
    }

    const highPct = d.high ? fmtDayPct(d.high, d.prevClose) : "";
    const lowPct = d.low ? fmtDayPct(d.low, d.prevClose) : "";

    return `
      <div class="card ${t.trapped ? 'trapped' : ''}">
        <div class="top-row">
          <div class="title-group">
            <h2>${t.name} ${t.trapped ? '<span class="tag">重点解套</span>' : ''}</h2>
            <div class="code">${t.code} · 高:${fmt(d.high)}${highPct} 低:${fmt(d.low)}${lowPct} · 量比:${d.volRatio || '--'}</div>
          </div>
          <div class="price-box">
            <div class="price ${colorCls}">${priceStr}</div>
            <div class="pct ${colorCls}">${pctStr}</div>
          </div>
        </div>

        <div class="signal-bar ${sig.warnFly ? 'warn-fly' : ''}">
          ${sig.text}
        </div>

        <div class="tier-section-title">
          <span>🟢 分档低吸买点（下跌时不后退，安心提前挂单）</span>
          <span>点击格子可切换</span>
        </div>
        <div class="levels-grid">
          ${renderTierBox(t.code, "buy", 1, "一档浅吸 (定靶)", "回踩均线接", tiers ? tiers.buy1 : undefined, d, dec, cfg.buyTier === 1)}
          ${renderTierBox(t.code, "buy", 2, "二档中吸 (定靶)", "盘中跳水接", tiers ? tiers.buy2 : undefined, d, dec, cfg.buyTier === 2)}
          ${renderTierBox(t.code, "buy", 3, "三档深吸 (定靶)", "暴跌黄金坑", tiers ? tiers.buy3 : undefined, d, dec, cfg.buyTier === 3)}
        </div>

        <div class="tier-section-title">
          <span>🔴 防T飞高抛卖点（强势日随均价自动上移拓宽）</span>
          <span>${tiers && tiers.isStrong ? '🔥 已触发防T飞上移' : '常规压力区间'}</span>
        </div>
        <div class="levels-grid">
          ${renderTierBox(t.code, "vwap", 0, "今日分时均价", "多空生命线", d.vwap, d, dec, false)}
          ${renderTierBox(t.code, "sell", 1, "一档高抛 (卖4成)", "常规冲高卖", tiers ? tiers.sell1 : undefined, d, dec, cfg.sellTier === 1)}
          ${renderTierBox(t.code, "sell", 2, "二档强抛 (卖6成)", "主升脉冲卖", tiers ? tiers.sell2 : undefined, d, dec, cfg.sellTier === 2)}
        </div>

        <div class="ma-row">
          <span>5日:${fmt(d.ma5)} ${d.ma5 ? fmtDayPct(d.ma5, d.price).replace('(', '(距现价') : ''}</span>
          <span>10日:${fmt(d.ma10)}</span>
          <span>20日:${fmt(d.ma20)}</span>
          <span>日均波幅:${fmt(d.atr)} (${atrPct})</span>
        </div>

        <div class="calc-box">
          <div class="calc-inputs">
            <div class="input-grp">
              <label>我的被套成本价</label>
              <input type="number" step="0.001" placeholder="填入成本" value="${cfg.cost}"
                onchange="saveConfig('${t.code}', 'cost', this.value)" />
            </div>
            <div class="input-grp">
              <label>当前底仓股数</label>
              <input type="number" step="100" value="${cfg.shares}"
                onchange="saveConfig('${t.code}', 'shares', this.value)" />
            </div>
            <div class="input-grp">
              <label>单次做T股数(≤底仓)</label>
              <input type="number" step="100" value="${cfg.tShares}"
                onchange="saveConfig('${t.code}', 'tShares', this.value)" />
            </div>
          </div>
          <div class="calc-result">
            ${calcHtml}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

async function refreshAll() {
  updateModeUI();
  document.getElementById("update-time").innerText = "正在刷新实时盘口与日K数据...";
  await fetchRealtimeQuotes();
  await fetchKLines();
  renderCards();
  const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  document.getElementById("update-time").innerText = `最后同步: ${now} (每15秒刷新)`;
}

refreshAll();
setInterval(async () => {
  await fetchRealtimeQuotes();
  renderCards();
  const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  document.getElementById("update-time").innerText = `最后同步: ${now} (每15秒刷新)`;
}, 15000);
</script>
</body>
