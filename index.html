<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持仓解套与日内做T量化驾驶舱</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --up: #ef4444;
      --down: #10b981;
      --accent: #3b82f6;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      max-width: 1280px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; align-items: center; gap: 12px; font-size: 0.88rem; color: var(--muted); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    button:hover { opacity: 0.9; }
    .grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .card.trapped { border-top: 3px solid var(--warn); }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .title-group h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
    .tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.18);
      color: var(--warn);
      font-weight: 600;
    }
    .code { color: var(--muted); font-size: 0.82rem; font-family: monospace; }
    .price-box { text-align: right; }
    .price { font-size: 1.55rem; font-weight: 700; font-family: monospace; }
    .pct { font-size: 0.9rem; font-weight: 600; font-family: monospace; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .signal-bar {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 8px;
      border-radius: 8px;
      text-align: center;
    }
    .lvl-item { display: flex; flex-direction: column; gap: 2px; }
    .lvl-label { font-size: 0.72rem; color: var(--muted); }
    .lvl-val { font-size: 0.92rem; font-weight: 700; font-family: monospace; }
    .lvl-r2, .lvl-r1 { color: #f87171; }
    .lvl-p { color: #fbbf24; }
    .lvl-s1, .lvl-s2 { color: #34d399; }

    .ma-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.35);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
    }

    .calc-box {
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .calc-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .input-grp { display: flex; flex-direction: column; gap: 3px; }
    .input-grp label { font-size: 0.72rem; color: var(--muted); }
    .input-grp input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.85rem;
      font-family: monospace;
      width: 100%;
    }
    .calc-result {
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎯 持仓解套与日内做T量化驾驶舱</h1>
    <div class="controls">
      <span id="update-time">正在同步真实日K线与实时盘口...</span>
      <button onclick="refreshAll()">立即刷新</button>
    </div>
  </div>

  <div class="grid" id="cards-container"></div>

<script>
// 核心监控标的（前4只为重点被套持仓）
const TARGETS = [
  { symbol: "sh515880", code: "515880", name: "通信ETF", isETF: true, trapped: true, decimals: 3 },
  { symbol: "sz159327", code: "159327", name: "半导材料ETF", isETF: true, trapped: true, decimals: 3 },
  { symbol: "sh517520", code: "517520", name: "永赢黄金股ETF", isETF: true, trapped: true, decimals: 3 },
  { symbol: "sz002716", code: "002716", name: "湖南白银", isETF: false, trapped: true, decimals: 2 },
  { symbol: "sh518880", code: "518880", name: "华安黄金ETF", isETF: true, trapped: false, decimals: 3 },
  { symbol: "sh513050", code: "513050", name: "中概互联网ETF", isETF: true, trapped: false, decimals: 3, defaultCost: "1.144" },
  { symbol: "sh512400", code: "512400", name: "有色金属ETF", isETF: true, trapped: false, decimals: 3 },
  { symbol: "sz159930", code: "159930", name: "汇添富能源ETF", isETF: true, trapped: false, decimals: 3 }
];

const marketData = {};

function loadScript(url) {
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = url;
    s.charset = "gbk";
    s.onload = () => { s.remove(); resolve(true); };
    s.onerror = () => { s.remove(); resolve(false); };
    document.body.appendChild(s);
  });
}

function getSavedConfig(code, defaultCost = "") {
  try {
    const raw = localStorage.getItem("t_cfg_" + code);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { cost: defaultCost, shares: 10000, tShares: 5000 };
}

function saveConfig(code, field, val) {
  const cfg = getSavedConfig(code);
  cfg[field] = val;
  localStorage.setItem("t_cfg_" + code, JSON.stringify(cfg));
  renderCards();
}

async function fetchRealtimeQuotes() {
  const qStr = TARGETS.map(t => t.symbol).join(",");
  await loadScript(`https://qt.gtimg.cn/q=${qStr}&_t=${Date.now()}`);
  TARGETS.forEach(t => {
    const raw = window["v_" + t.symbol];
    if (!raw) return;
    const p = raw.split("~");
    if (p.length > 40) {
      const price = parseFloat(p[3]) || 0;
      const prevClose = parseFloat(p[4]) || 0;
      const open = parseFloat(p[5]) || 0;
      const high = parseFloat(p[33]) || price;
      const low = parseFloat(p[34]) || price;
      const pct = parseFloat(p[32]) || 0;
      const volRatio = p[49] || "--";
      const turnover = p[38] || "--";

      // 计算日内分时均价 VWAP
      let vwap = (high + low + price) / 3;
      if (p[35] && p[35].includes("/")) {
        const sub = p[35].split("/");
        const volHands = parseFloat(sub[1]);
        const amtYuan = parseFloat(sub[2]);
        if (volHands > 0 && amtYuan > 0) {
          const calcVwap = amtYuan / (volHands * 100);
          if (calcVwap >= low * 0.98 && calcVwap <= high * 1.02) {
            vwap = calcVwap;
          }
        }
      }
      marketData[t.code] = {
        ...(marketData[t.code] || {}),
        price, prevClose, open, high, low, pct, vwap, volRatio, turnover
      };
    }
  });
}

async function fetchKLines() {
  const promises = TARGETS.map(async (t) => {
    const varName = "kline_" + t.symbol;
    const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var=${varName}&param=${t.symbol},day,,,30,qfq&_t=${Date.now()}`;
    await loadScript(url);
    const res = window[varName];
    if (res && res.data && res.data[t.symbol]) {
      const dObj = res.data[t.symbol];
      const klist = dObj.qfqday || dObj.day || [];
      if (klist.length >= 2) {
        // 判断最后一条K线是否是今天，取最近一个完整交易日算枢轴点
        const todayStr = new Date().toISOString().slice(0, 10);
        const lastBar = klist[klist.length - 1];
        const prevBar = (lastBar[0] === todayStr && klist.length >= 2)
          ? klist[klist.length - 2]
          : lastBar;

        const yHigh = parseFloat(prevBar[3]);
        const yLow = parseFloat(prevBar[4]);
        const yClose = parseFloat(prevBar[2]);

        // 经典枢轴点公式 (Pivot Points)
        const P = (yHigh + yLow + yClose) / 3;
        const R1 = 2 * P - yLow;
        const S1 = 2 * P - yHigh;
        const R2 = P + (yHigh - yLow);
        const S2 = P - (yHigh - yLow);

        // 真实均线 MA5 / MA10 / MA20
        const closes = klist.map(k => parseFloat(k[2]));
        const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
        const ma5 = closes.length >= 5 ? avg(closes.slice(-5)) : yClose;
        const ma10 = closes.length >= 10 ? avg(closes.slice(-10)) : yClose;
        const ma20 = closes.length >= 20 ? avg(closes.slice(-20)) : yClose;

        // 14日平均真实波幅 (ATR)
        let trSum = 0, trCount = 0;
        for (let i = Math.max(1, klist.length - 14); i < klist.length; i++) {
          const curH = parseFloat(klist[i][3]);
          const curL = parseFloat(klist[i][4]);
          const preC = parseFloat(klist[i - 1][2]);
          const tr = Math.max(curH - curL, Math.abs(curH - preC), Math.abs(curL - preC));
          trSum += tr;
          trCount++;
        }
        const atr = trCount > 0 ? trSum / trCount : (yHigh - yLow);

        marketData[t.code] = {
          ...(marketData[t.code] || {}),
          P, R1, R2, S1, S2, ma5, ma10, ma20, atr
        };
      }
    }
  });
  await Promise.all(promises);
}

function getActionSignal(d, dec) {
  if (!d || !d.price || !d.S1) return "⏳ 正在计算量化点位...";
  const p = d.price;
  if (p <= d.S2) return `🟢 跌破强支撑 S2(${d.S2.toFixed(dec)}) · 极度超跌正T低吸区`;
  if (p <= d.S1 * 1.003) return `🟢 触及 S1(${d.S1.toFixed(dec)}) 支撑区 · 关注分批低吸做正T`;
  if (p >= d.R2) return `🔴 突破强压力 R2(${d.R2.toFixed(dec)}) · 脉冲高抛锁定T差`;
  if (p >= d.R1 * 0.997) return `🔴 触及 R1(${d.R1.toFixed(dec)}) 压力区 · 关注高抛做反T`;
  const vwapDiff = ((p - d.vwap) / d.vwap * 100).toFixed(2);
  return `⚪ 盘中震荡（偏离分时均价 ${vwapDiff > 0 ? "+" : ""}${vwapDiff}%）· 耐心等两端挂单`;
}

function renderCards() {
  const container = document.getElementById("cards-container");
  container.innerHTML = TARGETS.map(t => {
    const d = marketData[t.code] || {};
    const dec = t.decimals;
    const priceStr = d.price ? d.price.toFixed(dec) : "--";
    const pct = d.pct || 0;
    const pctStr = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
    const colorCls = pct >= 0 ? "up" : "down";

    const fmt = v => (v !== undefined && !isNaN(v)) ? v.toFixed(dec) : "--";
    const atrPct = (d.atr && d.price) ? ((d.atr / d.price) * 100).toFixed(2) + "%" : "--";

    const cfg = getSavedConfig(t.code, t.defaultCost || "");
    const costNum = parseFloat(cfg.cost);
    const sharesNum = parseFloat(cfg.shares) || 0;
    const tSharesNum = parseFloat(cfg.tShares) || 0;

    // 解套与做T收益测算
    let calcHtml = `<span style="color:var(--muted)">💡 在上方填入你的被套成本价与股数，自动测算今日做T降本空间</span>`;
    if (d.price && d.S1 && d.R1 && sharesNum > 0) {
      const spread = Math.max(0, d.R1 - d.S1);
      // ETF免印花税，个股002716扣除万5印花税+万1过户佣金摩擦
      const feeRate = t.isETF ? 0.0001 : 0.0007;
      const grossProfit = spread * tSharesNum;
      const fee = (d.S1 + d.R1) * tSharesNum * feeRate;
      const netProfit = Math.max(0, grossProfit - fee);
      const costDropPerShare = netProfit / sharesNum;

      if (costNum > 0) {
        const pnlPct = ((d.price - costNum) / costNum * 100).toFixed(2);
        const needUpPct = costNum > d.price ? (((costNum - d.price) / d.price) * 100).toFixed(2) : "0.00";
        const newCost = (costNum - costDropPerShare).toFixed(dec);
        calcHtml = `
          <div>📌 当前浮盈亏：<b class="${d.price >= costNum ? 'up' : 'down'}">${pnlPct}%</b>（距离回本还需涨 <b>${needUpPct}%</b>）</div>
          <div>⚡ 若今日在 <b>S1(${fmt(d.S1)})</b> 买、<b>R1(${fmt(d.R1)})</b> 卖做T <b>${tSharesNum}</b> 股：</div>
          <div>👉 单次净赚约 <b>¥${netProfit.toFixed(1)}</b>，持仓成本可从 <b>${costNum}</b> 降至 <b style="color:#34d399">${newCost}</b></div>
        `;
      } else {
        calcHtml = `
          <div>⚡ 今日 S1→R1 理论T差空间：<b>${fmt(spread)}元 (${((spread/d.price)*100).toFixed(2)}%)</b></div>
          <div>👉 按做T <b>${tSharesNum}</b> 股测算，单次成功可净赚约 <b>¥${netProfit.toFixed(1)}</b>（每股降本 <b>${costDropPerShare.toFixed(dec)}元</b>）</div>
        `;
      }
    }

    return `
      <div class="card ${t.trapped ? 'trapped' : ''}">
        <div class="top-row">
          <div class="title-group">
            <h2>${t.name} ${t.trapped ? '<span class="tag">重点解套</span>' : ''}</h2>
            <div class="code">${t.code} · 高:${fmt(d.high)} 低:${fmt(d.low)} · 量比:${d.volRatio || '--'}</div>
          </div>
          <div class="price-box">
            <div class="price ${colorCls}">${priceStr}</div>
            <div class="pct ${colorCls}">${pctStr}</div>
          </div>
        </div>

        <div class="signal-bar">
          <span>${getActionSignal(d, dec)}</span>
        </div>

        <div class="levels-grid">
          <div class="lvl-item">
            <span class="lvl-label">强压 R2</span>
            <span class="lvl-val lvl-r2">${fmt(d.R2)}</span>
          </div>
          <div class="lvl-item">
            <span class="lvl-label">反T高抛 R1</span>
            <span class="lvl-val lvl-r1">${fmt(d.R1)}</span>
          </div>
          <div class="lvl-item">
            <span class="lvl-label">分时均价</span>
            <span class="lvl-val lvl-p">${fmt(d.vwap)}</span>
          </div>
          <div class="lvl-item">
            <span class="lvl-label">正T低吸 S1</span>
            <span class="lvl-val lvl-s1">${fmt(d.S1)}</span>
          </div>
          <div class="lvl-item">
            <span class="lvl-label">强撑 S2</span>
            <span class="lvl-val lvl-s2">${fmt(d.S2)}</span>
          </div>
        </div>

        <div class="ma-row">
          <span>MA5: ${fmt(d.ma5)}</span>
          <span>MA10: ${fmt(d.ma10)}</span>
          <span>MA20: ${fmt(d.ma20)}</span>
          <span>日均波幅ATR: ${fmt(d.atr)} (${atrPct})</span>
        </div>

        <div class="calc-box">
          <div class="calc-inputs">
            <div class="input-grp">
              <label>我的成本价</label>
              <input type="number" step="0.001" placeholder="填入成本" value="${cfg.cost}"
                onchange="saveConfig('${t.code}', 'cost', this.value)" />
            </div>
            <div class="input-grp">
              <label>底仓股数</label>
              <input type="number" step="100" value="${cfg.shares}"
                onchange="saveConfig('${t.code}', 'shares', this.value)" />
            </div>
            <div class="input-grp">
              <label>单次做T股数</label>
              <input type="number" step="100" value="${cfg.tShares}"
                onchange="saveConfig('${t.code}', 'tShares', this.value)" />
            </div>
          </div>
          <div class="calc-result">
            ${calcHtml}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

async function refreshAll() {
  document.getElementById("update-time").innerText = "正在刷新实时盘口与日K数据...";
  await fetchRealtimeQuotes();
  await fetchKLines();
  renderCards();
  const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  document.getElementById("update-time").innerText = `最后同步: ${now} (盘中每15秒自动刷新)`;
}

refreshAll();
setInterval(async () => {
  await fetchRealtimeQuotes();
  renderCards();
  const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  document.getElementById("update-time").innerText = `最后同步: ${now} (盘中每15秒自动刷新)`;
}, 15000);
</script>
</body>
</html>
