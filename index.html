<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持仓解套与分档做T量化驾驶舱</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --up: #ef4444;
      --down: #10b981;
      --accent: #3b82f6;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      max-width: 1320px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .sub-tip { font-size: 0.8rem; color: #38bdf8; margin-top: 2px; }
    .controls { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    button:hover { opacity: 0.9; }
    .grid {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .card.trapped { border-top: 3px solid var(--warn); }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .title-group h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
    .tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.18);
      color: var(--warn);
      font-weight: 600;
    }
    .code { color: var(--muted); font-size: 0.8rem; font-family: monospace; margin-top: 2px; }
    .price-box { text-align: right; }
    .price { font-size: 1.55rem; font-weight: 700; font-family: monospace; }
    .pct { font-size: 0.9rem; font-weight: 600; font-family: monospace; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .signal-bar {
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .tier-section-title {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: -4px;
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }
    .lvl-item {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid transparent;
      padding: 7px 6px;
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lvl-item:hover { border-color: #64748b; }
    .lvl-item.active-buy {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }
    .lvl-item.active-sell {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }
    .lvl-label { font-size: 0.72rem; color: #cbd5e1; font-weight: 600; }
    .lvl-sub { font-size: 0.65rem; color: var(--muted); }
    .lvl-val { font-size: 0.96rem; font-weight: 700; font-family: monospace; margin-top: 1px; }
    .c-buy { color: #34d399; }
    .c-sell { color: #f87171; }
    .c-vwap { color: #fbbf24; }

    .ma-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 0.76rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.35);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
    }

    .calc-box {
      border-top: 1px dashed var(--border);
      padding-top: 9px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .calc-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .input-grp { display: flex; flex-direction: column; gap: 3px; }
    .input-grp label { font-size: 0.72rem; color: var(--muted); }
    .input-grp input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.84rem;
      font-family: monospace;
      width: 100%;
    }
    .calc-result {
      font-size: 0.8rem;
      color: #e2e8f0;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>🎯 持仓解套与分档做T量化驾驶舱</h1>
      <div class="sub-tip">💡 提示：点击卡片上的【一档/二档/三档】格子，可自由切换不同档位测算做T降本金额</div>
    </div>
    <div class="controls">
      <span id="update-time">正在同步真实日K线与实时盘口...</span>
      <button onclick="refreshAll()">立即刷新</button>
    </div>
  </div>

  <div class="grid" id="cards-container"></div>

<script>
// 已预填你的真实成本与底仓股数
const TARGETS = [
  { symbol: "sh515880", code: "515880", name: "通信ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "0.583", defaultShares: 1700 },
  { symbol: "sz159327", code: "159327", name: "半导材料ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "0.978", defaultShares: 6300 },
  { symbol: "sh517520", code: "517520", name: "永赢黄金股ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "1.678", defaultShares: 500 },
  { symbol: "sz002716", code: "002716", name: "湖南白银", isETF: false, trapped: true, decimals: 2, defaultCost: "9.130", defaultShares: 100 },
  { symbol: "sh518880", code: "518880", name: "华安黄金ETF", isETF: true, trapped: false, decimals: 3, defaultCost: "", defaultShares: 1000 },
  { symbol: "sh513050", code: "513050", name: "中概互联网ETF", isETF: true, trapped: true, decimals: 3, defaultCost: "1.144", defaultShares: 10000 },
  { symbol: "sh512400", code: "512400", name: "有色金属ETF", isETF: true, trapped: false, decimals: 3, defaultCost: "", defaultShares: 1000 },
  { symbol: "sz159930", code: "159930", name: "汇添富能源ETF", isETF: true, trapped: false, decimals: 3, defaultCost: "", defaultShares: 1000 }
];

const marketData = {};

function loadScript(url) {
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = url;
    s.charset = "gbk";
    s.onload = () => { s.remove(); resolve(true); };
    s.onerror = () => { s.remove(); resolve(false); };
    document.body.appendChild(s);
  });
}

function getSavedConfig(t) {
  const def = {
    cost: t.defaultCost || "",
    shares: t.defaultShares || 1000,
    tShares: t.defaultShares || 1000,
    buyTier: 1,  // 默认选中一档浅吸（最容易成交）
    sellTier: 1  // 默认选中一档高抛
  };
  try {
    const raw = localStorage.getItem("t_cfg_v2_" + t.code);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { ...def, ...parsed };
    }
  } catch (e) {}
  return def;
}

function saveConfig(code, field, val) {
  const t = TARGETS.find(x => x.code === code);
  const cfg = getSavedConfig(t);
  cfg[field] = val;
  // 当用户修改底仓股数时，自动同步单次做T股数（防止做T股数大于底仓算出负数）
  if (field === "shares") {
    cfg.tShares = val;
  }
  if (field === "tShares" && parseFloat(val) > parseFloat(cfg.shares) && parseFloat(cfg.shares) > 0) {
    cfg.tShares = cfg.shares;
  }
  localStorage.setItem("t_cfg_v2_" + code, JSON.stringify(cfg));
  renderCards();
}

function selectTier(code, type, tierNum) {
  saveConfig(code, type === "buy" ? "buyTier" : "sellTier", tierNum);
}

async function fetchRealtimeQuotes() {
  const qStr = TARGETS.map(t => t.symbol).join(",");
  await loadScript(`https://qt.gtimg.cn/q=${qStr}&_t=${Date.now()}`);
  TARGETS.forEach(t => {
    const raw = window["v_" + t.symbol];
    if (!raw) return;
    const p = raw.split("~");
    if (p.length > 40) {
      const price = parseFloat(p[3]) || 0;
      const prevClose = parseFloat(p[4]) || 0;
      const open = parseFloat(p[5]) || 0;
      const high = parseFloat(p[33]) || price;
      const low = parseFloat(p[34]) || price;
      const pct = parseFloat(p[32]) || 0;
      const volRatio = p[49] || "--";

      let vwap = (high + low + price) / 3;
      if (p[35] && p[35].includes("/")) {
        const sub = p[35].split("/");
        const volHands = parseFloat(sub[1]);
        const amtYuan = parseFloat(sub[2]);
        if (volHands > 0 && amtYuan > 0) {
          const calcVwap = amtYuan / (volHands * 100);
          if (calcVwap >= low * 0.98 && calcVwap <= high * 1.02) {
            vwap = calcVwap;
          }
        }
      }
      marketData[t.code] = {
        ...(marketData[t.code] || {}),
        price, prevClose, open, high, low, pct, vwap, volRatio
      };
    }
  });
}

async function fetchKLines() {
  const promises = TARGETS.map(async (t) => {
    const varName = "kline_" + t.symbol;
    const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var=${varName}&param=${t.symbol},day,,,30,qfq&_t=${Date.now()}`;
    await loadScript(url);
    const res = window[varName];
    if (res && res.data && res.data[t.symbol]) {
      const dObj = res.data[t.symbol];
      const klist = dObj.qfqday || dObj.day || [];
      if (klist.length >= 2) {
        const todayStr = new Date().toISOString().slice(0, 10);
        const lastBar = klist[klist.length - 1];
        const prevBar = (lastBar[0] === todayStr && klist.length >= 2)
          ? klist[klist.length - 2]
          : lastBar;

        const yHigh = parseFloat(prevBar[3]);
        const yLow = parseFloat(prevBar[4]);
        const yClose = parseFloat(prevBar[2]);

        // 真实均线
        const closes = klist.map(k => parseFloat(k[2]));
        const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
        const ma5 = closes.length >= 5 ? avg(closes.slice(-5)) : yClose;
        const ma10 = closes.length >= 10 ? avg(closes.slice(-10)) : yClose;
        const ma20 = closes.length >= 20 ? avg(closes.slice(-20)) : yClose;

        // 14日平均真实波幅 (ATR)
        let trSum = 0, trCount = 0;
        for (let i = Math.max(1, klist.length - 14); i < klist.length; i++) {
          const curH = parseFloat(klist[i][3]);
          const curL = parseFloat(klist[i][4]);
          const preC = parseFloat(klist[i - 1][2]);
          const tr = Math.max(curH - curL, Math.abs(curH - preC), Math.abs(curL - preC));
          trSum += tr;
          trCount++;
        }
        const atr = trCount > 0 ? trSum / trCount : (yHigh - yLow);

        marketData[t.code] = {
          ...(marketData[t.code] || {}),
          yHigh, yLow, yClose, ma5, ma10, ma20, atr
        };
      }
    }
  });
  await Promise.all(promises);
}

// 核心升级：动态计算三档低吸与两档高抛（贴合当日真实盘面，不再高不可攀或低不可及）
function calcDynamicTiers(d) {
  if (!d || !d.price || !d.atr) return null;
  const vwap = d.vwap || d.price;
  const atr = d.atr;
  // 以今日分时均价与现价的锚点中心作为动态中枢
  const center = vwap * 0.65 + d.price * 0.35;

  // 三档低吸：
  // 一档浅吸（回踩分时均线下沿约 0.28 个 ATR，日内极易接货）
  const buy1 = Math.min(vwap - 0.22 * atr, d.price - 0.20 * atr);
  // 二档中吸（日内震荡洗盘位，约 0.50 个 ATR）
  const buy2 = center - 0.50 * atr;
  // 三档深吸（黄金坑大跌抄底位，约 0.85 个 ATR）
  const buy3 = center - 0.85 * atr;

  // 两档高抛：
  // 一档高抛（日内冲高常规卖出位，约 +0.35 个 ATR）
  const sell1 = Math.max(vwap + 0.32 * atr, d.price + 0.22 * atr);
  // 二档强抛（日内大涨脉冲止盈位，约 +0.70 个 ATR）
  const sell2 = center + 0.70 * atr;

  return { buy1, buy2, buy3, sell1, sell2 };
}

function getActionSignal(d, tiers, dec) {
  if (!d || !d.price || !tiers) return "⏳ 正在同步数据...";
  const p = d.price;
  const vwapDiff = ((p - d.vwap) / d.vwap * 100).toFixed(2);
  if (p <= tiers.buy2) return `🟢 已跌入【二档中吸(${tiers.buy2.toFixed(dec)})】下方 · 极佳低吸做正T机会`;
  if (p <= tiers.buy1 * 1.002) return `🟢 回踩【一档浅吸(${tiers.buy1.toFixed(dec)})】附近 · 可轻仓低吸做正T`;
  if (p >= tiers.sell2 * 0.998) return `🔴 冲高触及【二档强抛(${tiers.sell2.toFixed(dec)})】· 建议果断高抛锁利`;
  if (p > d.vwap * 1.012) return `🔴 拉升偏离均价线 +${vwapDiff}% · 可在【一档高抛(${tiers.sell1.toFixed(dec)})】挂单反T`;
  return `⚪ 围绕均价线震荡（偏离 ${vwapDiff > 0 ? "+" : ""}${vwapDiff}%）· 挂【一档浅吸 ${tiers.buy1.toFixed(dec)}】守株待兔`;
}

function renderCards() {
  const container = document.getElementById("cards-container");
  container.innerHTML = TARGETS.map(t => {
    const d = marketData[t.code] || {};
    const dec = t.decimals;
    const fmt = v => (v !== undefined && !isNaN(v)) ? v.toFixed(dec) : "--";
    const priceStr = d.price ? d.price.toFixed(dec) : "--";
    const pct = d.pct || 0;
    const pctStr = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
    const colorCls = pct >= 0 ? "up" : "down";
    const atrPct = (d.atr && d.price) ? ((d.atr / d.price) * 100).toFixed(2) + "%" : "--";

    const tiers = calcDynamicTiers(d);
    const cfg = getSavedConfig(t);
    const costNum = parseFloat(cfg.cost);
    const sharesNum = parseFloat(cfg.shares) || 0;
    const tSharesNum = Math.min(parseFloat(cfg.tShares) || 0, sharesNum);

    const buyTierNames = { 1: "一档浅吸", 2: "二档中吸", 3: "三档深吸" };
    const sellTierNames = { 1: "一档高抛", 2: "二档强抛" };

    let calcHtml = `<span style="color:var(--muted)">💡 填入成本价与底仓股数，自动测算做T降本金额</span>`;
    if (d.price && tiers && sharesNum > 0) {
      const selBuyPrice = tiers["buy" + (cfg.buyTier || 1)];
      const selSellPrice = tiers["sell" + (cfg.sellTier || 1)];
      const spread = Math.max(0, selSellPrice - selBuyPrice);
      const spreadPct = ((spread / d.price) * 100).toFixed(2);
      const feeRate = t.isETF ? 0.0001 : 0.0007;
      const grossProfit = spread * tSharesNum;
      const fee = (selBuyPrice + selSellPrice) * tSharesNum * feeRate;
      const netProfit = Math.max(0, grossProfit - fee);
      const costDropPerShare = netProfit / sharesNum;

      if (costNum > 0) {
        const pnlPct = ((d.price - costNum) / costNum * 100).toFixed(2);
        const needUpPct = costNum > d.price ? (((costNum - d.price) / d.price) * 100).toFixed(2) : "0.00";
        const newCost = (costNum - costDropPerShare).toFixed(dec);
        calcHtml = `
          <div>📌 当前浮亏：<b class="${d.price >= costNum ? 'up' : 'down'}">${pnlPct}%</b>（距回本需涨 <b>${needUpPct}%</b>）</div>
          <div>⚡ 按选中档位【<b>${buyTierNames[cfg.buyTier]}(${fmt(selBuyPrice)})</b> 买 → <b>${sellTierNames[cfg.sellTier]}(${fmt(selSellPrice)})</b> 卖】做T <b>${tSharesNum}</b> 股：</div>
          <div>👉 差价 <b>${spreadPct}%</b>，单次净赚 <b>¥${netProfit.toFixed(1)}</b>，持仓成本从 <b>${costNum}</b> 降至 <b style="color:#34d399">${newCost}</b></div>
        `;
      } else {
        calcHtml = `
          <div>⚡ 选中档位【${buyTierNames[cfg.buyTier]} → ${sellTierNames[cfg.sellTier]}】差价：<b>${fmt(spread)}元 (${spreadPct}%)</b></div>
          <div>👉 做T <b>${tSharesNum}</b> 股单次净赚约 <b>¥${netProfit.toFixed(1)}</b>（每股降本 <b>${costDropPerShare.toFixed(dec)}元</b>）</div>
        `;
      }
    }

    return `
      <div class="card ${t.trapped ? 'trapped' : ''}">
        <div class="top-row">
          <div class="title-group">
            <h2>${t.name} ${t.trapped ? '<span class="tag">重点解套</span>' : ''}</h2>
            <div class="code">${t.code} · 今日高:${fmt(d.high)} 低:${fmt(d.low)} · 量比:${d.volRatio || '--'}</div>
          </div>
          <div class="price-box">
            <div class="price ${colorCls}">${priceStr}</div>
            <div class="pct ${colorCls}">${pctStr}</div>
          </div>
        </div>

        <div class="signal-bar">
          ${getActionSignal(d, tiers, dec)}
        </div>

        <div class="tier-section-title">
          <span>🟢 分档低吸买点（点击格子可切换档位）</span>
          <span>成交通道：一档最易 → 三档最深</span>
        </div>
        <div class="levels-grid">
          <div class="lvl-item ${cfg.buyTier === 1 ? 'active-buy' : ''}" onclick="selectTier('${t.code}', 'buy', 1)">
            <span class="lvl-label">一档浅吸 (易买到)</span>
            <span class="lvl-sub">回踩均价线接</span>
            <span class="lvl-val c-buy">${tiers ? fmt(tiers.buy1) : '--'}</span>
          </div>
          <div class="lvl-item ${cfg.buyTier === 2 ? 'active-buy' : ''}" onclick="selectTier('${t.code}', 'buy', 2)">
            <span class="lvl-label">二档中吸 (常规)</span>
            <span class="lvl-sub">盘中跳水接</span>
            <span class="lvl-val c-buy">${tiers ? fmt(tiers.buy2) : '--'}</span>
          </div>
          <div class="lvl-item ${cfg.buyTier === 3 ? 'active-buy' : ''}" onclick="selectTier('${t.code}', 'buy', 3)">
            <span class="lvl-label">三档深吸 (黄金坑)</span>
            <span class="lvl-sub">暴跌抄底接</span>
            <span class="lvl-val c-buy">${tiers ? fmt(tiers.buy3) : '--'}</span>
          </div>
        </div>

        <div class="tier-section-title">
          <span>🔴 分档高抛卖点 & 🟡 今日平均成本线</span>
        </div>
        <div class="levels-grid">
          <div class="lvl-item" style="cursor:default">
            <span class="lvl-label">今日分时均价</span>
            <span class="lvl-sub">日内多空分界</span>
            <span class="lvl-val c-vwap">${fmt(d.vwap)}</span>
          </div>
          <div class="lvl-item ${cfg.sellTier === 1 ? 'active-sell' : ''}" onclick="selectTier('${t.code}', 'sell', 1)">
            <span class="lvl-label">一档高抛 (易卖出)</span>
            <span class="lvl-sub">常规冲高卖</span>
            <span class="lvl-val c-sell">${tiers ? fmt(tiers.sell1) : '--'}</span>
          </div>
          <div class="lvl-item ${cfg.sellTier === 2 ? 'active-sell' : ''}" onclick="selectTier('${t.code}', 'sell', 2)">
            <span class="lvl-label">二档强抛 (大涨)</span>
            <span class="lvl-sub">脉冲拉升卖</span>
            <span class="lvl-val c-sell">${tiers ? fmt(tiers.sell2) : '--'}</span>
          </div>
        </div>

        <div class="ma-row">
          <span>5日线:${fmt(d.ma5)}</span>
          <span>10日线:${fmt(d.ma10)}</span>
          <span>20日线:${fmt(d.ma20)}</span>
          <span>日均波动空间:${fmt(d.atr)} (${atrPct})</span>
        </div>

        <div class="calc-box">
          <div class="calc-inputs">
            <div class="input-grp">
              <label>我的被套成本价</label>
              <input type="number" step="0.001" placeholder="填入成本" value="${cfg.cost}"
                onchange="saveConfig('${t.code}', 'cost', this.value)" />
            </div>
            <div class="input-grp">
              <label>当前底仓股数</label>
              <input type="number" step="100" value="${cfg.shares}"
                onchange="saveConfig('${t.code}', 'shares', this.value)" />
            </div>
            <div class="input-grp">
              <label>单次做T股数(≤底仓)</label>
              <input type="number" step="100" value="${cfg.tShares}"
                onchange="saveConfig('${t.code}', 'tShares', this.value)" />
            </div>
          </div>
          <div class="calc-result">
            ${calcHtml}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

async function refreshAll() {
  document.getElementById("update-time").innerText = "正在刷新实时盘口与日K数据...";
  await fetchRealtimeQuotes();
  await fetchKLines();
  renderCards();
  const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  document.getElementById("update-time").innerText = `最后同步: ${now} (盘中每15秒自动刷新)`;
}

refreshAll();
setInterval(async () => {
  await fetchRealtimeQuotes();
  renderCards();
  const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  document.getElementById("update-time").innerText = `最后同步: ${now} (盘中每15秒自动刷新)`;
}, 15000);
</script>
</body>
