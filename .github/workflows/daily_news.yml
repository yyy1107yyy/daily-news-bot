name: Market Alert Bot

on:
  schedule:
    # 方案保险起见：不仅整点跑，每小时的第 5 分钟也作为一个备用触发，防止 GitHub 丢弃任务
    - cron: '5 1-15 * * *'
    # 早上 8:00 定时早报兜底
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
      - name: 2. 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 3. 安装依赖
        run: pip install -U requests feedparser akshare
      - name: 4. 执行定期战报推送
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python daily_news_wecom.py
