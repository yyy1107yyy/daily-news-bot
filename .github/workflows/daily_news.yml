name: Market Alert Bot

on:
  # 仅保留外部 API 触发与手动触发，彻底关闭 GitHub 内置随缘定时
  workflow_dispatch:

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装依赖
        run: pip install -U requests feedparser

      - name: 4. 执行定期战报推送
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python daily_news_wecom.py
